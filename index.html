<!-- ВЕРСИЯ: v1.5.2 (2026-07-24) — разрыв страницы больше никогда не виден в режиме чтения, даже если застрял внутри абзаца из-за старой вставки -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Книга</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --ink: #2b2622;
    --paper: #f2e9d8;
    --paper-edge: #e4d7bf;
    --paper-line: #d9c9ab;
    --min-bg: #16181c;
    --min-panel: #1e2128;
    --min-text: #e6e8ec;
    --min-muted: #8b909a;
    --min-accent: #c9a35e;
    --min-border: #2c3038;
  }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--min-bg);
    color: var(--min-text);
    overscroll-behavior: none;
  }
  #app { height: 100vh; width: 100vw; display: flex; flex-direction: column; position: relative; }

  /* ============ БИБЛИОТЕКА ============ */
  #library { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--min-bg); z-index: 30; }
  #library.hidden { display: none; }
  .lib-head {
    padding: 22px 20px 14px; border-bottom: 1px solid var(--min-border);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .lib-head h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; }
  .lib-head span { font-size: 12px; color: var(--min-muted); }
  .lib-list { flex: 1; overflow-y: auto; padding: 12px 16px 90px; }
  .book-card {
    background: var(--min-panel); border: 1px solid var(--min-border); border-radius: 12px;
    padding: 16px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: border-color .15s, transform .05s;
  }
  .book-card:active { transform: scale(0.99); }
  .book-spine {
    width: 42px; height: 54px; border-radius: 3px 5px 5px 3px; flex-shrink: 0;
    background: linear-gradient(105deg, #b07b3e, #8a5a28);
    box-shadow: inset -3px 0 6px rgba(0,0,0,.3), inset 3px 0 0 rgba(255,255,255,.12);
    position: relative;
  }
  .book-spine::after { content:""; position:absolute; left:6px; top:0; bottom:0; width:1.5px; background: rgba(0,0,0,.25); }
  .book-info { flex: 1; min-width: 0; }
  .book-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-info p { font-size: 12px; color: var(--min-muted); }
  .book-del {
    color: var(--min-muted); font-size: 20px; padding: 6px 8px; border-radius: 8px; flex-shrink: 0;
  }
  .book-del:active { background: rgba(255,80,80,.15); color: #ff6b6b; }
  .lib-empty { text-align: center; color: var(--min-muted); margin-top: 60px; font-size: 14px; line-height: 1.6; padding: 0 30px; }
  .fab {
    position: absolute; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--min-accent); color: #1a1a1a; border: none; font-size: 30px; font-weight: 300;
    box-shadow: 0 6px 18px rgba(201,163,94,.35); z-index: 40; display: flex; align-items: center; justify-content: center;
  }
  .fab:active { transform: scale(0.94); }

  /* ============ РЕДАКТОР ============ */
  #editor { position: absolute; inset: 0; display: none; flex-direction: column; }
  #editor.active { display: flex; }

  .top-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--min-panel); border-bottom: 1px solid var(--min-border); z-index: 10;
  }
  .icon-btn {
    background: none; border: none; color: var(--min-text); font-size: 18px; padding: 8px 10px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: rgba(255,255,255,.08); }
  .book-title-top { flex: 1; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tabs { display: flex; background: var(--min-panel); border-bottom: 1px solid var(--min-border); }
  .tab {
    flex: 1; padding: 11px 4px; text-align: center; font-size: 13px; color: var(--min-muted);
    border: none; background: none; border-bottom: 2px solid transparent; font-weight: 500;
  }
  .tab.active { color: var(--min-accent); border-bottom-color: var(--min-accent); }

  .panel { flex: 1; position: relative; overflow: hidden; }
  .panel.hidden { display: none; }
  #panel-write { display: flex; flex-direction: column; }
  #panel-write.hidden { display: none; }

  /* --- Формат-панель --- */
  .format-bar {
    display: flex; gap: 4px; padding: 6px 8px; background: var(--min-panel);
    border-bottom: 1px solid var(--min-border); overflow-x: auto; align-items: center;
  }
  .fmt {
    background: var(--min-bg); border: 1px solid var(--min-border); color: var(--min-text);
    min-width: 34px; height: 32px; border-radius: 7px; font-size: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0 8px;
  }
  .fmt.on { background: var(--min-accent); color: #1a1a1a; border-color: var(--min-accent); }
  .fmt b { font-weight: 800; }
  .fmt i { font-style: italic; }
  .fmt u { text-decoration: underline; }
  .fmt input[type=color] { width: 20px; height: 20px; border: none; background: none; padding: 0; border-radius: 4px; }
  .fmt select { background: var(--min-bg); color: var(--min-text); border: none; font-size: 13px; outline: none; }

  /* --- Написание --- */
  #write-wrap { flex: 1; position: relative; display: flex; min-height: 0; }
  .swipe-zone { width: 44px; flex-shrink: 0; background: linear-gradient(var(--min-panel), var(--min-bg)); position: relative; }
  .swipe-zone::after {
    content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 4px; height: 40px; border-radius: 2px; background: var(--min-border);
  }
  .swipe-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 9px; color: var(--min-muted); writing-mode: vertical-rl; letter-spacing: 1px; }
  #write-area {
    flex: 1; padding: 18px 14px; font-size: 17px; line-height: 1.7; color: var(--min-text);
    overflow-y: auto; outline: none; -webkit-user-select: text; user-select: text;
  }
  #write-area:empty::before { content: "Начните писать здесь…"; color: var(--min-muted); }
  .page-counter {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--min-muted); background: var(--min-panel);
    padding: 3px 12px; border-radius: 10px; border: 1px solid var(--min-border); pointer-events: none;
  }

  /* --- Чтение (классика) --- */
  #read-wrap { position: absolute; inset: 0; background: #3a2f22; overflow: hidden; touch-action: pan-y; }
  .r-page {
    position: absolute; inset: 0;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 8% 50%, rgba(120,90,50,.10), transparent 22%),
      repeating-linear-gradient(transparent, transparent 33px, rgba(150,120,80,.05) 34px);
    color: var(--ink);
    padding: 34px 28px calc(58px + env(safe-area-inset-bottom, 0px));
    font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.85;
    overflow: hidden; will-change: transform;
    box-shadow:
      inset 0 0 70px rgba(120,90,50,.14),
      inset 14px 0 22px -12px rgba(90,60,30,.30);
  }
  .r-page .r-text { word-wrap: break-word; display: flow-root; }
  .r-num {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0; text-align: center;
    font-size: 13px; color: #9a7a4e; font-family: Georgia, serif; font-style: italic;
    letter-spacing: .5px;
  }
  /* ===== ЗАКЛАДКА-ЛЕНТОЧКА ===== */
  .bookmark-ribbon {
    position: absolute; top: 0; right: 30px; width: 26px; height: 0;
    background: linear-gradient(180deg, #c0392b, #a52f22);
    box-shadow: 1px 2px 5px rgba(0,0,0,.35);
    z-index: 6; transition: height .35s cubic-bezier(.34,1.3,.5,1);
    pointer-events: none;
  }
  .bookmark-ribbon.on { height: 74px; }
  .bookmark-ribbon::after {
    content: ""; position: absolute; left: 0; bottom: -11px;
    border-left: 13px solid #a52f22; border-right: 13px solid #a52f22;
    border-bottom: 11px solid transparent;
  }
  .r-page.flipping { box-shadow: -12px 0 30px rgba(0,0,0,.35); }
  /* плавающая кнопка «поставить закладку» */
  .set-bm-fab {
    position: absolute; right: 18px;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(30,25,20,.72); color: #fff; border: 1px solid rgba(255,255,255,.15);
    font-size: 22px; z-index: 8; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.4); backdrop-filter: blur(4px);
  }
  .set-bm-fab:active { transform: scale(.92); }
  /* кнопка «к закладке» в шапке — горит, когда закладка стоит */
  #goto-bm-btn.bm-active { color: #e04b39; }
  .read-empty { display:flex; align-items:center; justify-content:center; height:100%; color:#8a6a44; font-style:italic; font-family:Georgia,serif; text-align:center; padding:0 40px; }

  /* --- Картинки в тексте (обтекание, как в Ворде) --- */
  /* .book-img-inline попадает и в write-area (тёмная тема), и в напечатанный
     .r-text страницы чтения (бумажная тема) — оформление плавающего блока
     одно и то же в обоих местах, специфика через контекстные селекторы ниже. */
  .book-img-inline { margin-bottom: 8px; position: relative; }
  .book-img-inline.float-left { float: left; margin-right: 14px; }
  .book-img-inline.float-right { float: right; margin-left: 14px; }
  .book-img-inline.centered { float: none; display: block; margin: 10px auto 14px; clear: both; }
  .book-img-inline img { width: 100%; height: auto; display: block; border-radius: 4px; user-select: none; -webkit-user-drag: none; }

  #write-area .book-img-inline { cursor: pointer; outline: 1px solid transparent; border-radius: 4px; }
  #write-area .book-img-inline.selected { outline: 2px dashed var(--min-accent); }
  .img-toolbar {
    position: absolute; top: -36px; left: 0; display: flex; gap: 3px;
    background: var(--min-panel); border: 1px solid var(--min-border); border-radius: 8px; padding: 3px;
    z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .img-toolbar.below { top: auto; bottom: -36px; }
  .img-toolbar button { background: none; border: none; color: var(--min-text); font-size: 14px; padding: 5px 7px; border-radius: 5px; }
  .img-toolbar button:active { background: rgba(255,255,255,.12); }
  .img-resize {
    position: absolute; right: -8px; bottom: -8px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--min-accent); border: 2px solid #1a1a1a; cursor: nwse-resize; touch-action: none; z-index: 5;
  }
  .img-move {
    position: absolute; left: -8px; top: -8px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--min-panel); border: 2px solid var(--min-accent); color: var(--min-accent);
    font-size: 12px; display: flex; align-items: center; justify-content: center;
    cursor: move; touch-action: none; z-index: 5;
  }
  .move-indicator { height: 3px; background: var(--min-accent); margin: 4px 0; border-radius: 2px; clear: both; }

  /* Ручной разрыв страницы — виден и кликабелен только во время написания;
     сама разбивка на страницы просто пропускает этот блок как содержимое. */
  .page-break-marker {
    clear: both; margin: 10px 0; padding: 6px 10px; border-radius: 6px;
    background: rgba(201,163,94,.12); border: 1px dashed var(--min-accent);
    color: var(--min-accent); font-size: 12px; text-align: center; cursor: pointer; user-select: none;
  }

  /* --- Заметки --- */
  #notes-area {
    position: absolute; inset: 0; padding: 18px 16px; font-size: 16px; line-height: 1.7;
    color: var(--min-text); background: var(--min-bg); overflow-y: auto; outline: none; border: none; resize: none; width: 100%; font-family: inherit;
  }
  #notes-area::placeholder { color: var(--min-muted); }

  /* --- Модалка --- */
  .modal-bg {
    position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--min-panel); border: 1px solid var(--min-border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 340px;
  }
  .modal h2 { font-size: 17px; margin-bottom: 14px; }
  .modal input {
    width: 100%; background: var(--min-bg); border: 1px solid var(--min-border); color: var(--min-text);
    padding: 11px 12px; border-radius: 9px; font-size: 15px; outline: none; margin-bottom: 16px;
  }
  .modal input:focus { border-color: var(--min-accent); }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button {
    flex: 1; padding: 11px; border-radius: 9px; border: none; font-size: 14px; font-weight: 600;
  }
  .btn-cancel { background: var(--min-bg); color: var(--min-muted); border: 1px solid var(--min-border) !important; }
  .btn-ok { background: var(--min-accent); color: #1a1a1a; }

  .toast {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--min-panel); border: 1px solid var(--min-border); color: var(--min-text);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- БИБЛИОТЕКА -->
  <div id="library">
    <div class="lib-head">
      <h1>Мои книги</h1>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
        <span id="lib-count"></span>
        <span id="app-version" style="font-size:10px; color: var(--min-muted); opacity:.6;"></span>
      </div>
    </div>
    <div class="lib-list" id="lib-list"></div>
    <button class="fab" id="add-book">+</button>
  </div>

  <!-- РЕДАКТОР -->
  <div id="editor">
    <div class="top-bar">
      <button class="icon-btn" id="back-btn">‹</button>
      <div class="book-title-top" id="cur-title">Книга</div>
      <button class="icon-btn" id="goto-bm-btn" title="К закладке">☆</button>
      <button class="icon-btn" id="rename-btn">✎</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="write">Написание</button>
      <button class="tab" data-tab="read">Чтение</button>
      <button class="tab" data-tab="notes">Заметки</button>
    </div>

    <!-- Написание -->
    <div class="panel" id="panel-write">
      <div class="format-bar">
        <button class="fmt" data-cmd="bold"><b>Ж</b></button>
        <button class="fmt" data-cmd="italic"><i>К</i></button>
        <button class="fmt" data-cmd="underline"><u>Ч</u></button>
        <label class="fmt"><input type="color" id="fmt-color" value="#e6e8ec"></label>
        <select class="fmt" id="fmt-size">
          <option value="3">A-</option>
          <option value="4" selected>A</option>
          <option value="5">A+</option>
          <option value="6">A++</option>
        </select>
        <button class="fmt" id="fmt-image" title="Вставить изображение">🖼</button>
        <button class="fmt" id="fmt-pagebreak" title="Разрыв страницы">✂️📄</button>
        <input type="file" id="write-img-input" accept="image/*" style="display:none">
      </div>
      <div id="write-wrap">
        <div class="swipe-zone" id="zone-left"><span class="swipe-hint">НАЗАД</span></div>
        <div id="write-area" contenteditable="true" spellcheck="true"></div>
        <div class="swipe-zone" id="zone-right"><span class="swipe-hint">ВПЕРЁД</span></div>
        <div class="page-counter" id="write-counter">Страница 1</div>
      </div>
    </div>

    <!-- Чтение -->
    <div class="panel hidden" id="panel-read">
      <div id="read-wrap"></div>
      <button class="set-bm-fab" id="set-bm-btn" title="Поставить закладку">➕</button>
    </div>

    <!-- Заметки -->
    <div class="panel hidden" id="panel-notes">
      <textarea id="notes-area" placeholder="Заметки к книге: имена персонажей, сюжетные линии, идеи…"></textarea>
    </div>
  </div>

  <!-- Модалка создания/переименования -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2 id="modal-title">Новая книга</h2>
      <input type="text" id="modal-input" placeholder="Название книги" maxlength="60">
      <div class="modal-btns">
        <button class="btn-cancel" id="modal-cancel">Отмена</button>
        <button class="btn-ok" id="modal-ok">Создать</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ================== ДАННЫЕ ==================
// Книги хранятся в localStorage браузера/webview — переживают перезагрузку
// страницы. Это НЕ синхронизация между устройствами: на другом телефоне или
// после очистки данных сайта в Telegram библиотека будет пустой.
let books = [];
let currentId = null;
let modalMode = 'create'; // 'create' | 'rename'
const APP_VERSION = 'v1.5.2';

const STORAGE_KEY = 'kniga_books_v1';
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(books)); }
  catch(e){ toast('Не удалось сохранить: не хватает места на устройстве'); console.error('persist failed', e); }
}
let persistTimer;
function persistDebounced(){ clearTimeout(persistTimer); persistTimer = setTimeout(persist, 600); }
function loadBooks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed) || !parsed.length) return false;
    books = parsed.map(b=>{
      const nb = { notes: '', page: 0, ...b };
      // Миграция со старой модели (v1.1/v1.2): картинки лежали отдельным
      // слоем поверх страницы. Теперь картинка — часть самого текста, поэтому
      // переносим их в конец текста как плавающие блоки (позиция на странице
      // не сохранится, но сама картинка не потеряется).
      if(Array.isArray(nb.images) && nb.images.length){
        const extra = nb.images.map(im=>
          `<div class="book-img-inline float-left" contenteditable="false" style="width:${Math.round((im.w||0.35)*100)}%"><img src="${im.src}"></div>`
        ).join('');
        nb.text = (nb.text||'') + extra;
      }
      delete nb.images;
      return nb;
    });
    return true;
  }catch(e){ console.error('Не удалось прочитать сохранённые книги', e); return false; }
}

// Уменьшает и пережимает картинку перед сохранением — иначе фото с телефона
// (по 3-5 МБ каждое) быстро упрутся в лимит localStorage (обычно 5-10 МБ).
function fileToResizedDataURL(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Страницы для режима чтения (разбивка по ~1200 симв)
const CHARS_PER_PAGE = 1200;

const $ = s => document.querySelector(s);
const library = $('#library'), editor = $('#editor');

// ================== БИБЛИОТЕКА ==================
function renderLibrary(){
  const list = $('#lib-list');
  $('#lib-count').textContent = books.length ? books.length + (books.length===1?' книга':books.length<5?' книги':' книг') : '';
  if(!books.length){
    list.innerHTML = '<div class="lib-empty">Пока нет ни одной книги.<br>Нажмите + чтобы создать первую.</div>';
    return;
  }
  list.innerHTML = '';
  books.forEach(b=>{
    const words = (b.text.replace(/<[^>]+>/g,' ').trim().match(/\S+/g)||[]).length;
    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      <div class="book-spine"></div>
      <div class="book-info">
        <h3></h3>
        <p>${words} слов</p>
      </div>
      <div class="book-del">🗑</div>`;
    card.querySelector('h3').textContent = b.title;
    card.querySelector('.book-info').onclick = ()=> openBook(b.id);
    card.querySelector('.book-spine').onclick = ()=> openBook(b.id);
    card.querySelector('.book-del').onclick = (e)=>{ e.stopPropagation(); delBook(b.id); };
    list.appendChild(card);
  });
}

function delBook(id){
  const b = books.find(x=>x.id===id);
  if(confirm(`Удалить книгу «${b.title}»? Это действие нельзя отменить.`)){
    books = books.filter(x=>x.id!==id);
    renderLibrary();

}

function saveCurrent(){

// ================== ЧТЕНИЕ: страницы + свайп-анимация ==================
let readPages = [], readIdx = 0;

// Вычисляет разбивку на страницы (readPages — массив HTML-строк, не plain
// text: так в «Чтении» сохраняются и форматирование, и картинки-обтекания).
// Единица разбивки — не предложение, а верхнеуровневый блок write-area
// (абзац/строка/картинка/разрыв страницы). Из-за этого при сильных правках
// текста ДО картинки она может «переехать» на другую страницу — цена за то,
// что картинки и текст теперь по-настоящему связаны, а не наложены поверх.
function computePages(){
  readPages = [];
  const writeArea = $('#write-area');
  const blocks = Array.from(writeArea.childNodes).filter(n=>{
    if(n.nodeType === 3) return n.textContent.trim().length > 0; // непустой текстовый узел
    return n.nodeType === 1; // любой элемент (абзац, картинка, разрыв страницы)
  });
  if(!blocks.length) return;

  const panelRead = $('#panel-read');
  const wasHidden = panelRead.classList.contains('hidden');
  if(wasHidden) panelRead.style.display = 'block';

  // Измеритель — невидимая страница с той же геометрией
  const meas = document.createElement('div');
  meas.className = 'r-page';
  meas.style.visibility = 'hidden';
  meas.innerHTML = '<div class="r-text"></div>';
  panelRead.appendChild(meas);
  const txtEl = meas.querySelector('.r-text');
  const maxH = meas.clientHeight - 92;

  function htmlOf(node){ return node.nodeType === 3 ? node.textContent : node.outerHTML; }
  function fitsHTML(html){ txtEl.innerHTML = html; return txtEl.scrollHeight <= maxH; }

  let cur = '';
  let curHasContent = false;
  blocks.forEach(node=>{
    if(node.nodeType===1 && node.classList.contains('page-break-marker')){
      if(curHasContent){ readPages.push(cur); cur=''; curHasContent=false; }
      return;
    }
    const piece = htmlOf(node);
    const candidate = cur + piece;
    if(!curHasContent || fitsHTML(candidate)){
      cur = candidate;
      curHasContent = true;
    } else {
      readPages.push(cur);
      cur = piece;
      curHasContent = true;
    }
  });
  if(curHasContent) readPages.push(cur);

  meas.remove();
  if(wasHidden) panelRead.style.display = '';
}

// Читалка: пересчитывает страницы и сразу их отображает (с пустым состоянием).
function buildReadPages(){
  computePages();
  const b = books.find(x=>x.id===currentId);
  const wrap = $('#read-wrap');
  if(!readPages.length){
    wrap.innerHTML = '<div class="read-empty">Страницы появятся, когда вы напишете текст или добавите картинку во вкладке «Написание».</div>';
    return;
  }
  readIdx = Math.min(b.page||0, Math.max(0, readPages.length-1));
  renderReadPage();
}

function makePage(idx){
  const el = document.createElement('div');
  el.className = 'r-page';
  el.innerHTML = `<div class="bookmark-ribbon"></div><div class="r-text"></div><div class="r-num">— ${idx+1} из ${readPages.length} —</div>`;
  const textEl = el.querySelector('.r-text');
  textEl.innerHTML = readPages[idx];
  // Подстраховка: разрыв страницы не должен быть виден при чтении никогда —
  // даже если он оказался вложен внутрь абзаца (например, остался от вставки
  // до фикса в v1.5.0) и поэтому не был пойман как верхнеуровневый блок.
  textEl.querySelectorAll('.page-break-marker').forEach(m=> m.remove());
  // ленточка видна, если на этой странице стоит закладка
  if(getBookmark() === idx){
    el.querySelector('.bookmark-ribbon').classList.add('on');
  }
  return el;
}

// ===== ЗАКЛАДКИ (сохраняются на устройстве через localStorage) =====
function bmKey(){ return 'bookmark_' + currentId; }
function getBookmark(){
  const v = localStorage.getItem(bmKey());
  return v === null ? -1 : parseInt(v, 10);
}
function setBookmark(idx){
  localStorage.setItem(bmKey(), idx);
  updateBookmarkUI();
}
function clearBookmark(){
  localStorage.removeItem(bmKey());
  updateBookmarkUI();
}
function toggleBookmark(){
  if(getBookmark() === readIdx) clearBookmark();  // на этой же странице — снять
  else setBookmark(readIdx);                       // иначе — поставить сюда
  renderReadPage();                                // перерисовать ленточку
}
function gotoBookmark(){
  const bm = getBookmark();
  if(bm < 0){ toast('Закладка ещё не поставлена — нажмите ➕ на странице'); return; }
  readIdx = Math.min(bm, readPages.length - 1);
  renderReadPage();
}
function updateBookmarkUI(){
  const bm = getBookmark();
  const gotoBtn = $('#goto-bm-btn');
  const setBtn  = $('#set-bm-btn');
  if(gotoBtn){
    // кнопка «к закладке» горит, только если закладка стоит
    gotoBtn.textContent = bm >= 0 ? '★' : '☆';
    gotoBtn.classList.toggle('bm-active', bm >= 0);
  }
  if(setBtn){
    // плавающая кнопка: заполнена, если закладка на текущей странице
    const here = bm === readIdx;
    setBtn.textContent = here ? '🔖' : '➕';
    setBtn.title = here ? 'Убрать закладку' : 'Поставить закладку';
  }
}

function renderReadPage(){
  const wrap = $('#read-wrap');
  wrap.innerHTML = '';
  wrap.appendChild(makePage(readIdx));
  updateBookmarkUI();
}

// свайп в зоне чтения
function flipTo(dir){ // dir=+1 вперёд, -1 назад
  const target = readIdx + dir;
  if(target < 0 || target >= readPages.length) { rubberBand(dir); return; }
  const wrap = $('#read-wrap');
  const oldPage = wrap.querySelector('.r-page');
  const newPage = makePage(target);

  if(dir === +1){
    // новая страница уже под текущей; текущая уезжает влево
    wrap.insertBefore(newPage, oldPage);
    oldPage.classList.add('flipping');
    oldPage.style.transition = 'transform .38s cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ oldPage.style.transform = 'translateX(-100%)'; });
    oldPage.addEventListener('transitionend', ()=>{ oldPage.remove(); }, {once:true});
  } else {
    // назад: новая страница въезжает слева поверх текущей
    newPage.classList.add('flipping');
    newPage.style.transform = 'translateX(-100%)';
    wrap.appendChild(newPage);
    newPage.style.transition = 'transform .38s cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ newPage.style.transform = 'translateX(0)'; });
    newPage.addEventListener('transitionend', ()=>{ oldPage.remove(); newPage.classList.remove('flipping'); }, {once:true});
  }
  readIdx = target;
  books.find(x=>x.id===currentId).page = readIdx;
}

function rubberBand(dir){
  const p = $('#read-wrap').querySelector('.r-page');
  if(!p) return;
  p.style.transition = 'transform .18s';
  p.style.transform = `translateX(${dir*-14}px)`;
  setTimeout(()=>{ p.style.transform='translateX(0)'; }, 160);
}

// ================== КАРТИНКИ В ТЕКСТЕ (обтекание, как в Ворде) ==================
// Картинка вставляется прямо в write-area как contenteditable="false"-виджет
// (.book-img-inline) с классом float-left/float-right — реальный CSS float,
// поэтому текст обтекает её и в момент написания, и в «Чтении» (та же разметка
// просто копируется в HTML нужной страницы при пересчёте computePages()).
// Свободного перетаскивания по XY больше нет — это принципиальное ограничение
// самого CSS-обтекания: картинка «привязана» к месту в тексте, двигать её
// можно только раньше/позже по потоку (ручка ✥) и менять сторону лева/права.

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

// Range.getBoundingClientRect работает и для текстовых узлов — нужно, чтобы
// ручка перемещения ориентировалась и на абзацы-<div>, и на голые строки текста.
function getRectOf(node){
  if(node.nodeType === 1) return node.getBoundingClientRect();
  const r = document.createRange();
  r.selectNodeContents(node);
  return r.getBoundingClientRect();
}

let selectedImgWidget = null;

function deselectImg(){
  if(selectedImgWidget){
    selectedImgWidget.classList.remove('selected');
    selectedImgWidget.querySelectorAll('.img-toolbar, .img-resize, .img-move').forEach(el=> el.remove());
  }
  selectedImgWidget = null;
}

function selectImg(widget){
  if(selectedImgWidget === widget) return;
  deselectImg();
  selectedImgWidget = widget;
  widget.classList.add('selected');

  const tb = document.createElement('div');
  tb.className = 'img-toolbar';
  tb.contentEditable = 'false';
  tb.innerHTML =
    '<button data-act="left" title="Обтекание слева">⬅</button>' +
    '<button data-act="center" title="По центру, без обтекания"><b>Ц</b></button>' +
    '<button data-act="right" title="Обтекание справа">➡</button>' +
    '<button data-act="del" title="Удалить">🗑</button>';
  tb.addEventListener('click', e=>{
    const act = e.target.closest('button') && e.target.closest('button').dataset.act;
    if(!act) return;
    e.preventDefault(); e.stopPropagation();
    if(act==='left'){ widget.classList.remove('float-right','centered'); widget.classList.add('float-left'); }
    if(act==='center'){ widget.classList.remove('float-left','float-right'); widget.classList.add('centered'); }
    if(act==='right'){ widget.classList.remove('float-left','centered'); widget.classList.add('float-right'); }
    if(act==='del'){ widget.remove(); deselectImg(); saveCurrent(); persistDebounced(); return; }
    saveCurrent(); persistDebounced();
  });
  widget.appendChild(tb);
  // Если картинка стоит у самого верха написанного (места над ней нет) —
  // тулбар разворачивается вниз, а не рисуется над картинкой впритык к панели
  // форматирования (как было видно на скриншоте — там он оказывался зажат).
  const writeRect = $('#write-area').getBoundingClientRect();
  const widgetRect = widget.getBoundingClientRect();
  if(widgetRect.top - writeRect.top < 40) tb.classList.add('below');

  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'img-resize';
  resizeHandle.title = 'Изменить размер';
  widget.appendChild(resizeHandle);
  attachResizeHandle(resizeHandle, widget);

  const moveHandle = document.createElement('div');
  moveHandle.className = 'img-move';
  moveHandle.title = 'Перетащить по тексту';
  moveHandle.textContent = '✥';
  widget.appendChild(moveHandle);
  attachMoveHandle(moveHandle, widget);
}

function attachResizeHandle(handle, widget){
  handle.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const containerWidth = $('#write-area').clientWidth;
    const startX = e.clientX;
    const startPct = parseFloat(widget.style.width) || 35;
    function onMove(ev){
      const deltaPct = ((ev.clientX-startX)/containerWidth)*100;
      widget.style.width = clamp(startPct + deltaPct, 15, 85) + '%';
    }
    function onUp(){
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      saveCurrent(); persistDebounced();
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp, {once:true});
  });
}

// Отдельный инструмент перемещения: тащишь ручку ✥ вверх/вниз по тексту,
// между абзацами появляется полоска-индикатор куда встанет картинка, отпустил
// — картинка переезжает туда. Надёжнее старых кнопок ▲/▼, которые переставляли
// картинку с ближайшим DOM-соседом «в слепую» (мог оказаться пустой обрывок).
function attachMoveHandle(handle, widget){
  handle.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const writeArea = $('#write-area');
    const indicator = document.createElement('div');
    indicator.className = 'move-indicator';
    indicator.contentEditable = 'false';
    let target = null, before = true;

    function updateTarget(clientY){
      const candidates = Array.from(writeArea.childNodes).filter(n=>
        n!==widget && n!==indicator &&
        (n.nodeType===1 || (n.nodeType===3 && n.textContent.trim()))
      );
      let bestNode = null, bestDist = Infinity, bestBefore = true;
      candidates.forEach(n=>{
        const rect = getRectOf(n);
        if(!rect || (rect.width===0 && rect.height===0)) return;
        const mid = rect.top + rect.height/2;
        const dist = Math.abs(clientY - mid);
        if(dist < bestDist){ bestDist = dist; bestNode = n; bestBefore = clientY < mid; }
      });
      if(bestNode){
        target = bestNode; before = bestBefore;
        writeArea.insertBefore(indicator, before ? target : target.nextSibling);
      }
    }

    function onMove(ev){ updateTarget(ev.clientY); }
    function onUp(){
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      if(target) writeArea.insertBefore(widget, before ? target : target.nextSibling);
      indicator.remove();
      deselectImg();
      selectImg(widget);
      saveCurrent(); persistDebounced();
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp, {once:true});
  });
}

// Клик по картинке — выделить (показать тулбар); клик по разрыву — убрать его;
// клик в пустое место — снять выделение.
$('#write-area').addEventListener('click', e=>{
  const marker = e.target.closest('.page-break-marker');
  if(marker){ marker.remove(); saveCurrent(); persistDebounced(); toast('Разрыв убран'); return; }
  const widget = e.target.closest('.book-img-inline');
  if(widget) selectImg(widget); else deselectImg();
});

// Вставляет узел на месте курсора через execCommand('insertHTML', ...) —
// в отличие от range.insertNode(), это заставляет браузер САМ разрезать
// окружающий абзац на «до» и «после», так что картинка/разрыв становятся
// отдельным верхнеуровневым блоком, а не тонут внутри абзаца. Второе было
// реальным багом: пагинация меряет только верхнеуровневые блоки, и если
// картинка оказывалась внутри абзаца — весь абзац+картинка мерились одним
// неделимым куском (отсюда «пустое место» на следующей странице), а разрыв
// страницы внутри абзаца пагинация вообще не видела как разрыв.
function insertAtCursor(node){
  const writeArea = $('#write-area');
  writeArea.focus();
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || !writeArea.contains(sel.anchorNode)){
    const r = document.createRange();
    r.selectNodeContents(writeArea);
    r.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r);
  }
  document.execCommand('insertHTML', false, node.outerHTML);
}

$('#fmt-image').onclick = ()=> $('#write-img-input').click();
$('#write-img-input').addEventListener('change', e=>{
  const file = e.target.files[0];
  e.target.value = '';

  fileToResizedDataURL(file, 1200).then(dataUrl=>{

});

// ================== ОБРАБОТКА СВАЙПОВ ==================
function addSwipe(el, onSwipe, minDist=40){
  let x0=null, y0=null, t0=0;
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0==null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    if(Math.abs(dx)>minDist && Math.abs(dx)>Math.abs(dy) && dt<700){
      onSwipe(dx<0 ? +1 : -1);
    }
    x0=y0=null;
  }, {passive:true});
  // мышь — для теста в браузере на ПК
  el.addEventListener('mousedown', e=>{ x0=e.clientX; y0=e.clientY; t0=Date.now(); });
  el.addEventListener('mouseup', e=>{
    if(x0==null) return;
    const dx=e.clientX-x0, dy=e.clientY-y0, dt=Date.now()-t0;
    if(Math.abs(dx)>minDist && Math.abs(dx)>Math.abs(dy) && dt<700){ onSwipe(dx<0 ? +1 : -1); }
    x0=y0=null;
  });
}

// Чтение — свайп по всей области (навешиваем на контейнер, страницы внутри pointer-events сквозные для свайпа)
addSwipe($('#read-wrap'), dir=> flipTo(dir), 35);

// Кнопки закладки
$('#set-bm-btn').addEventListener('click', toggleBookmark);
$('#goto-bm-btn').addEventListener('click', gotoBookmark);

// Написание — свайп ТОЛЬКО в боковых зонах
// Левая зона: свайп слева-направо = назад. Правая зона: справа-налево = вперёд.
addSwipe($('#zone-left'), dir=>{ if(dir<0) flipWritePage(-1); });
addSwipe($('#zone-right'), dir=>{ if(dir>0) flipWritePage(+1); });

// В режиме написания «страницы» условны — просто показываем счётчик и мигаем.
// (Текст непрерывный; перелистывание прокручивает поле к следующему экрану.)
function flipWritePage(dir){
  const area = $('#write-area');
  const step = area.clientHeight * 0.9;
  area.scrollBy({ top: dir*step, behavior:'smooth' });
  const p = $('#write-counter');
  p.style.transition='transform .15s'; p.style.transform='translateX(-50%) scale(1.15)';
  setTimeout(()=>p.style.transform='translateX(-50%) scale(1)',160);
}

$('#notes-area').addEventListener('input', ()=>{ saveCurrent(); persistDebounced(); });

// ================== TOAST ==================
let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=> el.classList.remove('show'), 1800);
}

// ================== СТАРТ ==================
// Пробуем восстановить книги из localStorage; если их там ещё нет (первый
// запуск на этом устройстве) — создаём демо-книгу для примера и сразу же
// сохраняем её, чтобы дальше всегда работать с реальным хранилищем.
if(!loadBooks()){
  books.push({
    id: 1, title: 'Один среди волков', page: 0,
    notes: 'Главный герой — Мстислав. Русский среди финнов.\nДом Вэняляинэн.\nДевиз: «Один среди волков».',
    text: `Снег ложился на крыши Оулу третий день подряд, и Мстислав знал — эта зима будет не последним испытанием.\n\nОн стоял у окна длинного дома, глядя, как ветер несёт белые хлопья над замёрзшим заливом. Чужак на чужой земле. Так его называли финны, и он давно перестал спорить.\n\n«Пусть говорят, — думал он. — Волки тоже воют, когда чуют силу».\n\nЗа спиной скрипнула дверь. Вошёл епископ Иван, стряхивая снег с плеч.\n\n— Вести с юга, господин, — произнёс он глухо. — Саво собирает людей.\n\nМстислав не обернулся. Он смотрел на звезду, что зажглась над лесом — первую в эту долгую ночь. Одну. Среди тьмы.\n\n— Пусть собирают, — сказал он наконец. — У волка тоже есть клыки.`
  });
  persist();
}
$('#app-version').textContent = APP_VERSION;
renderLibrary();
</script>
