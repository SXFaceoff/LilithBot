<!-- ВЕРСИЯ: v2.0.0 (2026-07-24) — «Бордовый Мул» зашит как книга по умолчанию вместо демо-книги «Один среди волков» (временное решение, пока нет общего облачного хранилища) -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Книга</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --ink: #2b2622;
    --paper: #f2e9d8;
    --paper-edge: #e4d7bf;
    --paper-line: #d9c9ab;
    --min-bg: #16181c;
    --min-panel: #1e2128;
    --min-text: #e6e8ec;
    --min-muted: #8b909a;
    --min-accent: #c9a35e;
    --min-border: #2c3038;
  }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--min-bg);
    color: var(--min-text);
    overscroll-behavior: none;
  }
  #app { height: 100vh; width: 100vw; display: flex; flex-direction: column; position: relative; }

  /* ============ БИБЛИОТЕКА ============ */
  #library { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--min-bg); z-index: 30; }
  #library.hidden { display: none; }
  .lib-head {
    padding: 22px 20px 14px; border-bottom: 1px solid var(--min-border);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .lib-head h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; }
  .lib-head span { font-size: 12px; color: var(--min-muted); }
  .lib-list { flex: 1; overflow-y: auto; padding: 12px 16px 90px; }
  .book-card {
    background: var(--min-panel); border: 1px solid var(--min-border); border-radius: 12px;
    padding: 16px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: border-color .15s, transform .05s;
  }
  .book-card:active { transform: scale(0.99); }
  .book-spine {
    width: 42px; height: 54px; border-radius: 3px 5px 5px 3px; flex-shrink: 0;
    background: linear-gradient(105deg, #b07b3e, #8a5a28);
    box-shadow: inset -3px 0 6px rgba(0,0,0,.3), inset 3px 0 0 rgba(255,255,255,.12);
    position: relative;
  }
  .book-spine::after { content:""; position:absolute; left:6px; top:0; bottom:0; width:1.5px; background: rgba(0,0,0,.25); }
  .book-info { flex: 1; min-width: 0; }
  .book-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-info p { font-size: 12px; color: var(--min-muted); }
  .book-del {
    color: var(--min-muted); font-size: 20px; padding: 6px 8px; border-radius: 8px; flex-shrink: 0;
  }
  .book-del:active { background: rgba(255,80,80,.15); color: #ff6b6b; }
  .lib-empty { text-align: center; color: var(--min-muted); margin-top: 60px; font-size: 14px; line-height: 1.6; padding: 0 30px; }
  .fab {
    position: absolute; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--min-accent); color: #1a1a1a; border: none; font-size: 30px; font-weight: 300;
    box-shadow: 0 6px 18px rgba(201,163,94,.35); z-index: 40; display: flex; align-items: center; justify-content: center;
  }
  .fab:active { transform: scale(0.94); }

  /* ============ РЕДАКТОР ============ */
  #editor { position: absolute; inset: 0; display: none; flex-direction: column; }
  #editor.active { display: flex; }

  .top-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--min-panel); border-bottom: 1px solid var(--min-border); z-index: 10;
  }
  .icon-btn {
    background: none; border: none; color: var(--min-text); font-size: 18px; padding: 8px 10px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: rgba(255,255,255,.08); }
  .book-title-top { flex: 1; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tabs { display: flex; background: var(--min-panel); border-bottom: 1px solid var(--min-border); }
  /* Внутри Telegram (для читателей канала) редактирование скрыто — открытая
     книга сразу и навсегда показывает только вкладку «Чтение». */
  body.reader-mode .tabs { display: none; }
  body.reader-mode #rename-btn { display: none; }
  .tab {
    flex: 1; padding: 11px 4px; text-align: center; font-size: 13px; color: var(--min-muted);
    border: none; background: none; border-bottom: 2px solid transparent; font-weight: 500;
  }
  .tab.active { color: var(--min-accent); border-bottom-color: var(--min-accent); }

  .panel { flex: 1; position: relative; overflow: hidden; }
  .panel.hidden { display: none; }
  #panel-write { display: flex; flex-direction: column; }
  #panel-write.hidden { display: none; }

  /* --- Формат-панель --- */
  .format-bar {
    display: flex; gap: 4px; padding: 6px 8px; background: var(--min-panel);
    border-bottom: 1px solid var(--min-border); overflow-x: auto; align-items: center;
  }
  .fmt {
    background: var(--min-bg); border: 1px solid var(--min-border); color: var(--min-text);
    min-width: 34px; height: 32px; border-radius: 7px; font-size: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0 8px;
  }
  .fmt.on { background: var(--min-accent); color: #1a1a1a; border-color: var(--min-accent); }
  .fmt b { font-weight: 800; }
  .fmt i { font-style: italic; }
  .fmt u { text-decoration: underline; }
  .fmt input[type=color] { width: 20px; height: 20px; border: none; background: none; padding: 0; border-radius: 4px; }
  .fmt select { background: var(--min-bg); color: var(--min-text); border: none; font-size: 13px; outline: none; }

  /* --- Написание --- */
  #write-wrap { flex: 1; position: relative; display: flex; min-height: 0; }
  .swipe-zone { width: 44px; flex-shrink: 0; background: linear-gradient(var(--min-panel), var(--min-bg)); position: relative; }
  .swipe-zone::after {
    content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 4px; height: 40px; border-radius: 2px; background: var(--min-border);
  }
  .swipe-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 9px; color: var(--min-muted); writing-mode: vertical-rl; letter-spacing: 1px; }
  #write-area {
    flex: 1; padding: 18px 14px; font-size: 17px; line-height: 1.7; color: var(--min-text);
    overflow-y: auto; outline: none; -webkit-user-select: text; user-select: text;
  }
  #write-area:empty::before { content: "Начните писать здесь…"; color: var(--min-muted); }
  .page-counter {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--min-muted); background: var(--min-panel);
    padding: 3px 12px; border-radius: 10px; border: 1px solid var(--min-border); pointer-events: none;
  }

  /* --- Чтение (классика) --- */
  #read-wrap { position: absolute; inset: 0; background: #3a2f22; overflow: hidden; touch-action: pan-y; }
  .r-page {
    position: absolute; inset: 0;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 8% 50%, rgba(120,90,50,.10), transparent 22%),
      repeating-linear-gradient(transparent, transparent 33px, rgba(150,120,80,.05) 34px);
    color: var(--ink);
    padding: 34px 28px calc(58px + env(safe-area-inset-bottom, 0px));
    font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.85;
    overflow: hidden; will-change: transform;
    box-shadow:
      inset 0 0 70px rgba(120,90,50,.14),
      inset 14px 0 22px -12px rgba(90,60,30,.30);
  }
  .r-page .r-text { word-wrap: break-word; display: flow-root; }
  .r-num {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0; text-align: center;
    font-size: 13px; color: #9a7a4e; font-family: Georgia, serif; font-style: italic;
    letter-spacing: .5px;
  }
  /* ===== ЗАКЛАДКА-ЛЕНТОЧКА ===== */
  .bookmark-ribbon {
    position: absolute; top: 0; right: 30px; width: 26px; height: 0;
    background: linear-gradient(180deg, #c0392b, #a52f22);
    box-shadow: 1px 2px 5px rgba(0,0,0,.35);
    z-index: 6; transition: height .35s cubic-bezier(.34,1.3,.5,1);
    pointer-events: none;
  }
  .bookmark-ribbon.on { height: 74px; }
  .bookmark-ribbon::after {
    content: ""; position: absolute; left: 0; bottom: -11px;
    border-left: 13px solid #a52f22; border-right: 13px solid #a52f22;
    border-bottom: 11px solid transparent;
  }
  .r-page.flipping { box-shadow: -12px 0 30px rgba(0,0,0,.35); }
  /* плавающая кнопка «поставить закладку» */
  .set-bm-fab {
    position: absolute; right: 18px;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(30,25,20,.72); color: #fff; border: 1px solid rgba(255,255,255,.15);
    font-size: 22px; z-index: 8; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.4); backdrop-filter: blur(4px);
  }
  .set-bm-fab:active { transform: scale(.92); }
  /* кнопка «к закладке» в шапке — горит, когда закладка стоит */
  #goto-bm-btn.bm-active { color: #e04b39; }
  .read-empty { display:flex; align-items:center; justify-content:center; height:100%; color:#8a6a44; font-style:italic; font-family:Georgia,serif; text-align:center; padding:0 40px; }

  /* --- Картинки в тексте (обтекание, как в Ворде) --- */
  /* .book-img-inline попадает и в write-area (тёмная тема), и в напечатанный
     .r-text страницы чтения (бумажная тема) — оформление плавающего блока
     одно и то же в обоих местах, специфика через контекстные селекторы ниже. */
  .book-img-inline { margin-bottom: 8px; position: relative; }
  .book-img-inline.float-left { float: left; margin-right: 14px; }
  .book-img-inline.float-right { float: right; margin-left: 14px; }
  .book-img-inline.centered { float: none; display: block; margin: 10px auto 14px; clear: both; }
  .book-img-inline img { width: 100%; height: auto; display: block; border-radius: 4px; user-select: none; -webkit-user-drag: none; }

  #write-area .book-img-inline { cursor: pointer; outline: 1px solid transparent; border-radius: 4px; }
  #write-area .book-img-inline.selected { outline: 2px dashed var(--min-accent); }
  .img-toolbar {
    position: absolute; top: -36px; left: 0; display: flex; gap: 3px;
    background: var(--min-panel); border: 1px solid var(--min-border); border-radius: 8px; padding: 3px;
    z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .img-toolbar.below { top: auto; bottom: -36px; }
  .img-toolbar button { background: none; border: none; color: var(--min-text); font-size: 14px; padding: 5px 7px; border-radius: 5px; }
  .img-toolbar button:active { background: rgba(255,255,255,.12); }
  .img-resize {
    position: absolute; right: -8px; bottom: -8px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--min-accent); border: 2px solid #1a1a1a; cursor: nwse-resize; touch-action: none; z-index: 5;
  }
  .img-move {
    position: absolute; left: -8px; top: -8px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--min-panel); border: 2px solid var(--min-accent); color: var(--min-accent);
    font-size: 12px; display: flex; align-items: center; justify-content: center;
    cursor: move; touch-action: none; z-index: 5;
  }
  .move-indicator { height: 3px; background: var(--min-accent); margin: 4px 0; border-radius: 2px; clear: both; }

  /* Ручной разрыв страницы — виден и кликабелен только во время написания;
     сама разбивка на страницы просто пропускает этот блок как содержимое. */
  .page-break-marker {
    clear: both; margin: 10px 0; padding: 6px 10px; border-radius: 6px;
    background: rgba(201,163,94,.12); border: 1px dashed var(--min-accent);
    color: var(--min-accent); font-size: 12px; text-align: center; cursor: pointer; user-select: none;
  }

  /* --- Заметки --- */
  #notes-area {
    position: absolute; inset: 0; padding: 18px 16px; font-size: 16px; line-height: 1.7;
    color: var(--min-text); background: var(--min-bg); overflow-y: auto; outline: none; border: none; resize: none; width: 100%; font-family: inherit;
  }
  #notes-area::placeholder { color: var(--min-muted); }

  /* --- Модалка --- */
  .modal-bg {
    position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--min-panel); border: 1px solid var(--min-border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 340px;
  }
  .modal h2 { font-size: 17px; margin-bottom: 14px; }
  .modal input {
    width: 100%; background: var(--min-bg); border: 1px solid var(--min-border); color: var(--min-text);
    padding: 11px 12px; border-radius: 9px; font-size: 15px; outline: none; margin-bottom: 16px;
  }
  .modal input:focus { border-color: var(--min-accent); }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button {
    flex: 1; padding: 11px; border-radius: 9px; border: none; font-size: 14px; font-weight: 600;
  }
  .btn-cancel { background: var(--min-bg); color: var(--min-muted); border: 1px solid var(--min-border) !important; }
  .btn-ok { background: var(--min-accent); color: #1a1a1a; }

  .toast {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--min-panel); border: 1px solid var(--min-border); color: var(--min-text);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- БИБЛИОТЕКА -->
  <div id="library">
    <div class="lib-head">
      <h1>Мои книги</h1>
      <div style="display:flex; align-items:center; gap:4px;">
        <button class="icon-btn" id="export-btn" title="Выгрузить все книги в файл">📤</button>
        <button class="icon-btn" id="import-btn" title="Загрузить книги из файла">📥</button>
        <input type="file" id="import-file-input" accept=".json,application/json" style="display:none">
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
          <span id="lib-count"></span>
          <span id="app-version" style="font-size:10px; color: var(--min-muted); opacity:.6;"></span>
        </div>
      </div>
    </div>
    <div class="lib-list" id="lib-list"></div>
    <button class="fab" id="add-book">+</button>
  </div>

  <!-- РЕДАКТОР -->
  <div id="editor">
    <div class="top-bar">
      <button class="icon-btn" id="back-btn">‹</button>
      <div class="book-title-top" id="cur-title">Книга</div>
      <button class="icon-btn" id="goto-bm-btn" title="К закладке">☆</button>
      <button class="icon-btn" id="rename-btn">✎</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="write">Написание</button>
      <button class="tab" data-tab="read">Чтение</button>
      <button class="tab" data-tab="notes">Заметки</button>
    </div>

    <!-- Написание -->
    <div class="panel" id="panel-write">
      <div class="format-bar">
        <button class="fmt" data-cmd="bold"><b>Ж</b></button>
        <button class="fmt" data-cmd="italic"><i>К</i></button>
        <button class="fmt" data-cmd="underline"><u>Ч</u></button>
        <label class="fmt"><input type="color" id="fmt-color" value="#e6e8ec"></label>
        <select class="fmt" id="fmt-size">
          <option value="3">A-</option>
          <option value="4" selected>A</option>
          <option value="5">A+</option>
          <option value="6">A++</option>
        </select>
        <button class="fmt" id="fmt-image" title="Вставить изображение">🖼</button>
        <button class="fmt" id="fmt-pagebreak" title="Разрыв страницы">✂️📄</button>
        <input type="file" id="write-img-input" accept="image/*" style="display:none">
      </div>
      <div id="write-wrap">
        <div class="swipe-zone" id="zone-left"><span class="swipe-hint">НАЗАД</span></div>
        <div id="write-area" contenteditable="true" spellcheck="true"></div>
        <div class="swipe-zone" id="zone-right"><span class="swipe-hint">ВПЕРЁД</span></div>
        <div class="page-counter" id="write-counter">Страница 1</div>
      </div>
    </div>

    <!-- Чтение -->
    <div class="panel hidden" id="panel-read">
      <div id="read-wrap"></div>
      <button class="set-bm-fab" id="set-bm-btn" title="Поставить закладку">➕</button>
    </div>

    <!-- Заметки -->
    <div class="panel hidden" id="panel-notes">
      <textarea id="notes-area" placeholder="Заметки к книге: имена персонажей, сюжетные линии, идеи…"></textarea>
    </div>
  </div>

  <!-- Модалка создания/переименования -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2 id="modal-title">Новая книга</h2>
      <input type="text" id="modal-input" placeholder="Название книги" maxlength="60">
      <div class="modal-btns">
        <button class="btn-cancel" id="modal-cancel">Отмена</button>
        <button class="btn-ok" id="modal-ok">Создать</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ================== TELEGRAM ==================
// initData непустой только при реальном запуске внутри Telegram (из ссылки
// t.me/.../Kniga) — просто наличие window.Telegram.WebApp ни о чём не говорит,
// SDK создаёт этот объект-заглушку даже в обычном браузере.
const IN_TELEGRAM = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
if(IN_TELEGRAM){
  document.body.classList.add('reader-mode');
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

// ================== ДАННЫЕ ==================
// Книги хранятся в localStorage браузера/webview — переживают перезагрузку
// страницы. Это НЕ синхронизация между устройствами: на другом телефоне или
// после очистки данных сайта в Telegram библиотека будет пустой.
let books = [];
let currentId = null;
let modalMode = 'create'; // 'create' | 'rename'
const APP_VERSION = 'v2.0.0';

const STORAGE_KEY = 'kniga_books_v1';
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(books)); }
  catch(e){ toast('Не удалось сохранить: не хватает места на устройстве'); console.error('persist failed', e); }
}
let persistTimer;
function persistDebounced(){ clearTimeout(persistTimer); persistTimer = setTimeout(persist, 600); }
function loadBooks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed) || !parsed.length) return false;
    books = parsed.map(b=>{
      const nb = { notes: '', page: 0, ...b };
      // Миграция со старой модели (v1.1/v1.2): картинки лежали отдельным
      // слоем поверх страницы. Теперь картинка — часть самого текста, поэтому
      // переносим их в конец текста как плавающие блоки (позиция на странице
      // не сохранится, но сама картинка не потеряется).
      if(Array.isArray(nb.images) && nb.images.length){
        const extra = nb.images.map(im=>
          `<div class="book-img-inline float-left" contenteditable="false" style="width:${Math.round((im.w||0.35)*100)}%"><img src="${im.src}"></div>`
        ).join('');
        nb.text = (nb.text||'') + extra;
      }
      delete nb.images;
      return nb;
    });
    return true;
  }catch(e){ console.error('Не удалось прочитать сохранённые книги', e); return false; }
}

// Уменьшает и пережимает картинку перед сохранением — иначе фото с телефона
// (по 3-5 МБ каждое) быстро упрутся в лимит localStorage (обычно 5-10 МБ).
function fileToResizedDataURL(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Страницы для режима чтения (разбивка по ~1200 симв)
const CHARS_PER_PAGE = 1200;

// ================== ЭКСПОРТ / ИМПОРТ ==================
// localStorage привязан к конкретному origin (домену/протоколу) — локальный
// файл на компьютере (file://) и развёрнутая версия на GitHub Pages (https://)
// это два РАЗНЫХ, никогда не связанных хранилища, даже на одном устройстве.
// Экспорт/импорт — единственный способ перенести книги между ними (или между
// телефоном и компьютером).
function exportBooks(){
  const data = JSON.stringify(books, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kniga-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Файл с книгами скачан');
}
$('#export-btn').onclick = exportBooks;

$('#import-btn').onclick = ()=> $('#import-file-input').click();
$('#import-file-input').addEventListener('change', e=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(!Array.isArray(imported)) throw new Error('not an array');
      const existingIds = new Set(books.map(b=>b.id));
      let added = 0;
      imported.forEach(b=>{
        if(!b || typeof b !== 'object') return;
        const nb = { notes: '', page: 0, text: '', title: 'Без названия', ...b };
        if(existingIds.has(nb.id)) nb.id = Date.now() + Math.random();
        existingIds.add(nb.id);
        books.push(nb);
        added++;
      });
      renderLibrary();
      persist();
      toast(`Добавлено книг: ${added}`);
    }catch(err){
      console.error('import failed', err);
      toast('Не удалось прочитать файл — это точно файл, скачанный кнопкой «Экспорт»?');
    }
  };
  reader.readAsText(file);
});

// ================== ЧТЕНИЕ: страницы + свайп-анимация ==================
let readPages = [], readIdx = 0;

// Вычисляет разбивку на страницы (readPages — массив HTML-строк, не plain
// text: так в «Чтении» сохраняются и форматирование, и картинки-обтекания).
// Единица разбивки — не предложение, а верхнеуровневый блок write-area
// (абзац/строка/картинка/разрыв страницы). Из-за этого при сильных правках
// текста ДО картинки она может «переехать» на другую страницу — цена за то,
// что картинки и текст теперь по-настоящему связаны, а не наложены поверх.
function computePages(){
  readPages = [];
  const writeArea = $('#write-area');
  const blocks = Array.from(writeArea.childNodes).filter(n=>{
    if(n.nodeType === 3) return n.textContent.trim().length > 0; // непустой текстовый узел
    return n.nodeType === 1; // любой элемент (абзац, картинка, разрыв страницы)
  });
  if(!blocks.length) return;

  const panelRead = $('#panel-read');
  const wasHidden = panelRead.classList.contains('hidden');
  if(wasHidden) panelRead.style.display = 'block';

  // Измеритель — невидимая страница с той же геометрией
  const meas = document.createElement('div');
  meas.className = 'r-page';
  meas.style.visibility = 'hidden';
  meas.innerHTML = '<div class="r-text"></div>';
  panelRead.appendChild(meas);
  const txtEl = meas.querySelector('.r-text');
  const maxH = meas.clientHeight - 92;

  function htmlOf(node){ return node.nodeType === 3 ? node.textContent : node.outerHTML; }
  function fitsHTML(html){ txtEl.innerHTML = html; return txtEl.scrollHeight <= maxH; }

  // Находит текстовый узел и смещение внутри него, соответствующие смещению
  // charOffset в ПЛОСКОМ тексте всего node (обход через все вложенные теги —
  // жирный/курсив/цвет остаются целыми, режем только по границе символов).
  function resolveTextOffset(node, charOffset){
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    let remaining = charOffset, n, last = null;
    while((n = walker.nextNode())){
      const len = n.textContent.length;
      if(remaining <= len) return { node: n, offset: remaining };
      remaining -= len;
      last = n;
    }
    return last ? { node: last, offset: last.textContent.length } : { node: node, offset: 0 };
  }

  // Разбивает блок (абзац) на отдельные предложения, каждое — валидный кусок
  // HTML с сохранённым форматированием (через Range.cloneContents — он сам
  // корректно "дозакрывает"/"переоткрывает" вложенные теги на границе).
  // Нужно на случай, когда абзац целиком не помещается в остаток страницы —
  // тогда режем по предложению, а не переносим весь абзац сразу.
  function splitIntoSentences(node){
    if(node.nodeType !== 1) return null;
    const plain = node.textContent;
    const matches = plain.match(/[^.!?…]+[.!?…]+[»"')\]]*|\S.+$/g);
    if(!matches || matches.length <= 1) return null;
    const pieces = [];
    let searchFrom = 0;
    for(const sentence of matches){
      const foundAt = plain.indexOf(sentence, searchFrom);
      const start = foundAt >= 0 ? foundAt : searchFrom;
      const end = start + sentence.length;
      searchFrom = end;
      const range = document.createRange();
      const s = resolveTextOffset(node, start), e = resolveTextOffset(node, end);
      range.setStart(s.node, s.offset);
      range.setEnd(e.node, e.offset);
      const wrapper = document.createElement(node.tagName || 'DIV');
      wrapper.appendChild(range.cloneContents());
      pieces.push(wrapper.outerHTML);
    }
    return pieces;
  }

  // Пустая строка-абзац (например, <div><br></div> — след двойного Enter для
  // отступа между абзацами) не должна САМА решать, помещается ли она на
  // страницу: если проверять её отдельно как обычный блок, она иногда не
  // влезает вместе с предыдущим текстом и становится ЕДИНСТВЕННЫМ содержимым
  // новой страницы — та выглядит совсем пустой для читателя. Поэтому пустые
  // блоки всегда молча прилипают к уже набираемой странице, без проверки fit.
  function isBlankBlock(node){
    if(node.nodeType !== 1) return false;
    if(node.classList.contains('book-img-inline') || node.classList.contains('page-break-marker')) return false;
    return node.textContent.replace(/ /g, ' ').trim().length === 0;
  }

  let cur = '';
  let curHasContent = false;
  blocks.forEach(node=>{
    if(node.nodeType===1 && node.classList.contains('page-break-marker')){
      if(curHasContent){ readPages.push(cur); cur=''; curHasContent=false; }
      return;
    }
    const piece = htmlOf(node);
    if(isBlankBlock(node) && curHasContent){
      cur += piece;
      return;
    }
    const candidate = cur + piece;
    if(!curHasContent || fitsHTML(candidate)){
      cur = candidate;
      curHasContent = true;
      return;
    }
    // Абзац целиком не влез в остаток страницы — пробуем по предложениям,
    // чтобы не оставлять пустое место внизу страницы. Если резать нечего
    // (одно предложение, картинка, короткая строка) — переносим целиком, как раньше.
    const sentences = splitIntoSentences(node);
    if(!sentences){
      readPages.push(cur);
      cur = piece;
      curHasContent = true;
      return;
    }
    sentences.forEach(sentPiece=>{
      const cand2 = cur + sentPiece;
      if(!curHasContent || fitsHTML(cand2)){
        cur = cand2;
        curHasContent = true;
      } else {
        readPages.push(cur);
        cur = sentPiece;
        curHasContent = true;
      }
    });
  });
  if(curHasContent) readPages.push(cur);

  meas.remove();
  if(wasHidden) panelRead.style.display = '';
}

// Читалка: пересчитывает страницы и сразу их отображает (с пустым состоянием).
function buildReadPages(){
  computePages();
  const b = books.find(x=>x.id===currentId);
  const wrap = $('#read-wrap');
  if(!readPages.length){
    wrap.innerHTML = '<div class="read-empty">Страницы появятся, когда вы напишете текст или добавите картинку во вкладке «Написание».</div>';
    return;
  }
  readIdx = Math.min(b.page||0, Math.max(0, readPages.length-1));
  renderReadPage();
}

function makePage(idx){
  const el = document.createElement('div');
  el.className = 'r-page';
  el.innerHTML = `<div class="bookmark-ribbon"></div><div class="r-text"></div><div class="r-num">— ${idx+1} из ${readPages.length} —</div>`;
  const textEl = el.querySelector('.r-text');
  textEl.innerHTML = readPages[idx];
  // Подстраховка: разрыв страницы не должен быть виден при чтении никогда —
  // даже если он оказался вложен внутрь абзаца (например, остался от вставки
  // до фикса в v1.5.0) и поэтому не был пойман как верхнеуровневый блок.
  // Осторожно: у старых разрывов (вставленных ДО фикса) внутрь мог случайно
  // затесаться настоящий текст абзаца — если внутри маркера есть что-то, кроме
  // одной текстовой подписи «✂ Разрыв страницы», этот текст сохраняем, вынося
  // его наружу, а не теряем вместе с маркером.
  textEl.querySelectorAll('.page-break-marker').forEach(m=>{
    const onlyLabel = m.childNodes.length === 1 && m.firstChild.nodeType === 3;
    if(onlyLabel){
      m.remove();
      return;
    }
    const labelNode = Array.from(m.childNodes).find(n=> n.nodeType===3 && n.textContent.includes('Разрыв страницы'));
    if(labelNode) labelNode.remove();
    while(m.firstChild) m.parentNode.insertBefore(m.firstChild, m);
    m.remove();
  });
  // ленточка видна, если на этой странице стоит закладка
  if(getBookmark() === idx){
    el.querySelector('.bookmark-ribbon').classList.add('on');
  }
  return el;
}

// ===== ЗАКЛАДКИ (сохраняются на устройстве через localStorage) =====
function bmKey(){ return 'bookmark_' + currentId; }
function getBookmark(){
  const v = localStorage.getItem(bmKey());
  return v === null ? -1 : parseInt(v, 10);
}
function setBookmark(idx){
  localStorage.setItem(bmKey(), idx);
  updateBookmarkUI();
}
function clearBookmark(){
  localStorage.removeItem(bmKey());
  updateBookmarkUI();
}
function toggleBookmark(){
  if(getBookmark() === readIdx) clearBookmark();  // на этой же странице — снять
  else setBookmark(readIdx);                       // иначе — поставить сюда
  renderReadPage();                                // перерисовать ленточку
}
function gotoBookmark(){
  const bm = getBookmark();
  if(bm < 0){ toast('Закладка ещё не поставлена — нажмите ➕ на странице'); return; }
  readIdx = Math.min(bm, readPages.length - 1);
  renderReadPage();
}
function updateBookmarkUI(){
  const bm = getBookmark();
  const gotoBtn = $('#goto-bm-btn');
  const setBtn  = $('#set-bm-btn');
  if(gotoBtn){
    // кнопка «к закладке» горит, только если закладка стоит
    gotoBtn.textContent = bm >= 0 ? '★' : '☆';
    gotoBtn.classList.toggle('bm-active', bm >= 0);
  }
  if(setBtn){
    // плавающая кнопка: заполнена, если закладка на текущей странице
    const here = bm === readIdx;
    setBtn.textContent = here ? '🔖' : '➕';
    setBtn.title = here ? 'Убрать закладку' : 'Поставить закладку';
  }
}

function renderReadPage(){
  const wrap = $('#read-wrap');
  wrap.innerHTML = '';
  wrap.appendChild(makePage(readIdx));
  updateBookmarkUI();
}

// свайп в зоне чтения
function flipTo(dir){ // dir=+1 вперёд, -1 назад
  const target = readIdx + dir;
  if(target < 0 || target >= readPages.length) { rubberBand(dir); return; }
  const wrap = $('#read-wrap');
  const oldPage = wrap.querySelector('.r-page');
  const newPage = makePage(target);

  if(dir === +1){
    // новая страница уже под текущей; текущая уезжает влево
    wrap.insertBefore(newPage, oldPage);
    oldPage.classList.add('flipping');
    oldPage.style.transition = 'transform .38s cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ oldPage.style.transform = 'translateX(-100%)'; });
    oldPage.addEventListener('transitionend', ()=>{ oldPage.remove(); }, {once:true});
  } else {
    // назад: новая страница въезжает слева поверх текущей
    newPage.classList.add('flipping');
    newPage.style.transform = 'translateX(-100%)';
    wrap.appendChild(newPage);
    newPage.style.transition = 'transform .38s cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ newPage.style.transform = 'translateX(0)'; });
    newPage.addEventListener('transitionend', ()=>{ oldPage.remove(); newPage.classList.remove('flipping'); }, {once:true});
  }
  readIdx = target;
  books.find(x=>x.id===currentId).page = readIdx;
}

function rubberBand(dir){
  const p = $('#read-wrap').querySelector('.r-page');
  if(!p) return;
  p.style.transition = 'transform .18s';
  p.style.transform = `translateX(${dir*-14}px)`;
  setTimeout(()=>{ p.style.transform='translateX(0)'; }, 160);
}

// ================== КАРТИНКИ В ТЕКСТЕ (обтекание, как в Ворде) ==================
// Картинка вставляется прямо в write-area как contenteditable="false"-виджет
// (.book-img-inline) с классом float-left/float-right — реальный CSS float,
// поэтому текст обтекает её и в момент написания, и в «Чтении» (та же разметка
// просто копируется в HTML нужной страницы при пересчёте computePages()).
// Свободного перетаскивания по XY больше нет — это принципиальное ограничение
// самого CSS-обтекания: картинка «привязана» к месту в тексте, двигать её
// можно только раньше/позже по потоку (ручка ✥) и менять сторону лева/права.

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

// Range.getBoundingClientRect работает и для текстовых узлов — нужно, чтобы
// ручка перемещения ориентировалась и на абзацы-<div>, и на голые строки текста.
function getRectOf(node){
  if(node.nodeType === 1) return node.getBoundingClientRect();
  const r = document.createRange();
  r.selectNodeContents(node);
  return r.getBoundingClientRect();
}

let selectedImgWidget = null;

function deselectImg(){
  if(selectedImgWidget){
    selectedImgWidget.classList.remove('selected');
    selectedImgWidget.querySelectorAll('.img-toolbar, .img-resize, .img-move').forEach(el=> el.remove());
  }
  selectedImgWidget = null;
}

function selectImg(widget){
  if(selectedImgWidget === widget) return;
  deselectImg();
  selectedImgWidget = widget;
  widget.classList.add('selected');

  const tb = document.createElement('div');
  tb.className = 'img-toolbar';
  tb.contentEditable = 'false';
  tb.innerHTML =
    '<button data-act="left" title="Обтекание слева">⬅</button>' +
    '<button data-act="center" title="По центру, без обтекания"><b>Ц</b></button>' +
    '<button data-act="right" title="Обтекание справа">➡</button>' +
    '<button data-act="del" title="Удалить">🗑</button>';
  tb.addEventListener('click', e=>{
    const act = e.target.closest('button') && e.target.closest('button').dataset.act;
    if(!act) return;
    e.preventDefault(); e.stopPropagation();
    if(act==='left'){ widget.classList.remove('float-right','centered'); widget.classList.add('float-left'); }
    if(act==='center'){ widget.classList.remove('float-left','float-right'); widget.classList.add('centered'); }
    if(act==='right'){ widget.classList.remove('float-left','centered'); widget.classList.add('float-right'); }
    if(act==='del'){ widget.remove(); deselectImg(); saveCurrent(); persistDebounced(); return; }
    saveCurrent(); persistDebounced();
  });
  widget.appendChild(tb);
  // Если картинка стоит у самого верха написанного (места над ней нет) —
  // тулбар разворачивается вниз, а не рисуется над картинкой впритык к панели
  // форматирования (как было видно на скриншоте — там он оказывался зажат).
  const writeRect = $('#write-area').getBoundingClientRect();
  const widgetRect = widget.getBoundingClientRect();
  if(widgetRect.top - writeRect.top < 40) tb.classList.add('below');

  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'img-resize';
  resizeHandle.title = 'Изменить размер';
  widget.appendChild(resizeHandle);
  attachResizeHandle(resizeHandle, widget);

  const moveHandle = document.createElement('div');
  moveHandle.className = 'img-move';
  moveHandle.title = 'Перетащить по тексту';
  moveHandle.textContent = '✥';
  widget.appendChild(moveHandle);
  attachMoveHandle(moveHandle, widget);
}

function attachResizeHandle(handle, widget){
  handle.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const containerWidth = $('#write-area').clientWidth;
    const startX = e.clientX;
    const startPct = parseFloat(widget.style.width) || 35;
    function onMove(ev){
      const deltaPct = ((ev.clientX-startX)/containerWidth)*100;
      widget.style.width = clamp(startPct + deltaPct, 15, 85) + '%';
    }
    function onUp(){
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      saveCurrent(); persistDebounced();
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp, {once:true});
  });
}

// Отдельный инструмент перемещения: тащишь ручку ✥ вверх/вниз по тексту,
// между абзацами появляется полоска-индикатор куда встанет картинка, отпустил
// — картинка переезжает туда. Надёжнее старых кнопок ▲/▼, которые переставляли
// картинку с ближайшим DOM-соседом «в слепую» (мог оказаться пустой обрывок).
function attachMoveHandle(handle, widget){
  handle.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const writeArea = $('#write-area');
    const indicator = document.createElement('div');
    indicator.className = 'move-indicator';
    indicator.contentEditable = 'false';
    let target = null, before = true;

    function updateTarget(clientY){
      const candidates = Array.from(writeArea.childNodes).filter(n=>
        n!==widget && n!==indicator &&
        (n.nodeType===1 || (n.nodeType===3 && n.textContent.trim()))
      );
      let bestNode = null, bestDist = Infinity, bestBefore = true;
      candidates.forEach(n=>{
        const rect = getRectOf(n);
        if(!rect || (rect.width===0 && rect.height===0)) return;
        const mid = rect.top + rect.height/2;
        const dist = Math.abs(clientY - mid);
        if(dist < bestDist){ bestDist = dist; bestNode = n; bestBefore = clientY < mid; }
      });
      if(bestNode){
        target = bestNode; before = bestBefore;
        writeArea.insertBefore(indicator, before ? target : target.nextSibling);
      }
    }

    function onMove(ev){ updateTarget(ev.clientY); }
    function onUp(){
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      if(target) writeArea.insertBefore(widget, before ? target : target.nextSibling);
      indicator.remove();
      deselectImg();
      selectImg(widget);
      saveCurrent(); persistDebounced();
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp, {once:true});
  });
}

// Клик по картинке — выделить (показать тулбар); клик по разрыву — убрать его;

// Вставляет узел на месте курсора через execCommand('insertHTML', ...) —
// в отличие от range.insertNode(), это заставляет браузер САМ разрезать
// окружающий абзац на «до» и «после», так что картинка/разрыв становятся
// отдельным верхнеуровневым блоком, а не тонут внутри абзаца. Второе было
// реальным багом: пагинация меряет только верхнеуровневые блоки, и если
// картинка оказывалась внутри абзаца — весь абзац+картинка мерились одним
// неделимым куском (отсюда «пустое место» на следующей странице), а разрыв
// страницы внутри абзаца пагинация вообще не видела как разрыв.
function insertAtCursor(node){
  const writeArea = $('#write-area');
  writeArea.focus();
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || !writeArea.contains(sel.anchorNode)){
    const r = document.createRange();
    r.selectNodeContents(writeArea);
    r.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r);
  }
  document.execCommand('insertHTML', false, node.outerHTML);
}

// ================== ОБРАБОТКА СВАЙПОВ ==================
function addSwipe(el, onSwipe, minDist=40){
  let x0=null, y0=null, t0=0;
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0==null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    if(Math.abs(dx)>minDist && Math.abs(dx)>Math.abs(dy) && dt<700){
      onSwipe(dx<0 ? +1 : -1);
    }
    x0=y0=null;
  }, {passive:true});
  // мышь — для теста в браузере на ПК
  el.addEventListener('mousedown', e=>{ x0=e.clientX; y0=e.clientY; t0=Date.now(); });
  el.addEventListener('mouseup', e=>{
    if(x0==null) return;
    const dx=e.clientX-x0, dy=e.clientY-y0, dt=Date.now()-t0;
    if(Math.abs(dx)>minDist && Math.abs(dx)>Math.abs(dy) && dt<700){ onSwipe(dx<0 ? +1 : -1); }
    x0=y0=null;
  });
}

// Написание — свайп ТОЛЬКО в боковых зонах
// Левая зона: свайп слева-направо = назад. Правая зона: справа-налево = вперёд.
addSwipe($('#zone-left'), dir=>{ if(dir<0) flipWritePage(-1); });
addSwipe($('#zone-right'), dir=>{ if(dir>0) flipWritePage(+1); });

// В режиме написания «страницы» условны — просто показываем счётчик и мигаем.
// (Текст непрерывный; перелистывание прокручивает поле к следующему экрану.)
function flipWritePage(dir){
  const area = $('#write-area');
  const step = area.clientHeight * 0.9;
  area.scrollBy({ top: dir*step, behavior:'smooth' });
  const p = $('#write-counter');
  p.style.transition='transform .15s'; p.style.transform='translateX(-50%) scale(1.15)';
  setTimeout(()=>p.style.transform='translateX(-50%) scale(1)',160);
}

}

IIFChWluLe3HwztLoQRC4bVZEMuwbyvhqcZ74z5UzZqhQoUAqNHkcJGjO7HAVRkmiIIJBGCKOOR4pFkidkdTlWU4IPsaLJIySST3JqQLilA4UgedJox2oMABg5PPkKIin7gAGLAAzGCfen9bRI7/bGiovhocKMD8ooCECaKjFFRsAPzYoiOaL96lN+agC+lCjoN3FAChRmioAUVDzo6AFG4O0SEjnjv6UBRNQEtNMvWFixgKrfki2ZmAEmG2nny5GOaj3cEltcSW8oAkjYo2CCMj3HekknaBk8dvak+VAAUDQHelDsaWwTmn4JbZLe4SW28WR1Aik3keEcgk4HByMjn1qOKM96ZhQNAUDQZINKY5OcAfSkClGlSETkUmlUk96BAoBsEEYozSRQY80KLzo6AFChRDzoAwKI1MuQBp9kQACQ+T6/NUM0FAo6TShQYs0PrTyAGymJAyHXB/WmT3oA6Lzo6LzoAUKHmaAoD//Z\" draggable=\"false\"></div><div><div class=\"page-break-marker\" contenteditable=\"false\">✂ Разрыв страницы</div><div><br></div><div># Глава 1</div></div><div><br></div><div>---</div><div><br></div><div>3 мая 2907 года.</div><div><br></div><div>До выхода к орбите Отиса оставалось чуть меньше трёх часов.</div><div><br></div><div>«Бордовый Мул» шёл ровно, тяжело пробивая себе путь сквозь пустоту, словно старый, видавший виды буксир, который слишком часто видел шторма и слишком мало — тихие гавани. Под металлической палубой размеренно гудели модернизированные маршевые двигатели, установленные ещё Карлом Синтом почти двадцать лет назад. Их низкий, басовитый гул проникал повсюду: в переборки, в потрёпанный металл мебели, в ложки, в человеческие кости и даже в сны.</div><div><br></div><div>Кай Синт стоял у крошечной кухонной ниши, помешивая деревянной лопаткой густую овсяную кашу в потёртой кастрюле. Пар поднимался густыми клубами, смешиваясь с терпким запахом табачного дыма от его сигареты, которая тлела в уголке рта. Жёлтая лампа под потолком заливала тесный жилой модуль тёплым, почти домашним медным светом, хотя «домашним» это место можно было назвать лишь с большой натяжкой.</div><div><br></div><div>Катер был старым. Очень старым.</div><div><br></div><div>На складном металлическом столике, рассчитанном строго на двоих, виднелись глубокие царапины от гаечных ключей и отвёрток Карла. Возле вентиляционной решётки темнело старое пятно от упавшей сигареты. На стене рядом с кухней висела выцветшая фотография: Карл, улыбающийся во весь рот возле разобранного двигателя, и рядом — худой подросток с упрямым взглядом, весь в машинном масле. Сам Кай.</div><div><br></div><div>Он бросил быстрый взгляд на снимок и едва заметно усмехнулся краешком губ.</div><div><br></div><div>Из ниши с двухъярусной кроватью, отгороженной потрёпанной брезентовой шторкой, доносилось ровное, будто сонное дыхание. Шторка была задёрнута не до конца. Из-за неё, соблазнительно расслабленная и тёплая после сна, небрежно свисала обнажённая женская нога — стройная, с изящной линией бедра, кожа которого мягко блестела в полумраке. Пальчики слегка шевелились, словно девушка во сне лениво потягивалась. Нога была открыта почти до середины бедра, и в тесноте катера это выглядело неожиданно интимно, живо, по-домашнему.</div><div><br></div><div>Майкл Нолан, сидевший за столиком, сложив перед собой большие мозолистые руки, покосился на эту ногу и недовольно цыкнул языком.</div><div><br></div><div>— Тьфу ты, девка совсем стыд потеряла, — проворчал он с характерным ирландским рычанием в голосе. — Совсем как её бабка в молодости, прости Господи.</div><div><br></div><div>Старик тяжело поднялся, шагнул к нише и аккуратно, но твёрдо заправил шторку обратно, прикрывая внучку. Его седеющая борода дрогнула, когда он вернулся на место.</div><div><br></div><div>Кай хмыкнул, не оборачиваясь, и продолжил раскладывать густую, дымящуюся кашу по металлическим тарелкам. Ложки звякнули о края.</div><div><br></div><div>— Спит? — спросил он тихо.</div><div><br></div><div>— Вроде бы, — буркнул Майкл. — Хотя с этой девчонкой никогда не знаешь наверняка.</div><div><br></div><div>Кай поставил одну тарелку перед стариком, вторую — себе. Горячая каша пахла просто и сытно — овсянка, щепотка соли и ничего лишнего. Они оба принялись есть, медленно, по-мужски основательно, зачерпывая ложками густую массу. Кай дул на каждую порцию, прежде чем отправить в рот, а Майкл ел почти без пауз, словно привык питаться быстро и без изысков между вахтами.</div><div><br></div><div>Некоторое время они ели молча. Гул двигателей заполнял паузу лучше любых слов. За годы совместных рейсов между ними выросла та особая, крепкая, как старый трос, дружба, где молчание было таким же естественным, как разговор.</div><div><br></div><div>Первым заговорил Майкл, вытирая усы тыльной стороной ладони.</div><div><br></div><div>— Помнишь, парень, как мы с Карлом ставили эти чёртовы форсажные блоки? — Голос у него был низкий, с хрипотцой и тёплым ирландским акцентом, который особенно проявлялся в ворчливых нотках. — Неделю, мать его, спорили над схемами, как два старых пса из-за кости.</div><div><br></div><div>Кай усмехнулся, отправляя в рот очередную ложку каши.</div><div><br></div><div>— Ещё бы не помнить. Ты тогда орал, что Карл хочет взорвать всю посудину к чертям собачьим.</div><div><br></div><div>— Потому что твой приёмный отец считал себя самым умным ирландцем и самым умным инженером в этом секторе сразу, — проворчал Майкл с сухой улыбкой. — А ты, мелкий засранец, всё время путал ключи. На двенадцать и на четырнадцать — для тебя было одно и то же.</div><div><br></div><div>Кай рассмеялся тихо, чтобы не разбудить якобы спящую Роузи.</div><div><br></div><div>— Не каждый день.</div><div><br></div><div>— Каждый, мать его, день! — Майкл ткнул в него ложкой. — Я тебе говорил: «Кай, парень, ты когда-нибудь научишься?» А ты только глазами хлопал и снова совал не тот ключ.</div><div><br></div><div>Они оба коротко посмеялись. Кай зачерпнул ещё каши, медленно прожёвывая. Вкус был простой, привычный, почти родной.</div><div><br></div><div>Разговор постепенно стал тише, серьёзнее. Майкл отодвинул опустевшую тарелку и посмотрел в одну точку.</div><div><br></div><div>— Забавно... В те годы моя маленькая Роузи была ещё совсем крохой. Жила на Новой Надежде, в чистенькой люльке, с мамой и папой... Хорошая была планета тогда.</div><div><br></div><div>Кай кивнул, не перебивая. Он знал, что некоторые воспоминания лучше слушать молча.</div><div><br></div><div>— Она почти ничего не помнит о родителях, — продолжил Майкл чуть хрипловато. — И, может, оно и к лучшему. А я... я просто устал, Кай. Устал каждый раз думать, что однажды её разбудит не мой голос, а сирена аварийного сброса.</div><div><br></div><div>Старик кивнул в сторону ниши.</div><div><br></div><div>— Этот хмель в трюме — моя последняя большая ставка, парень. Если всё пройдёт гладко, хватит, чтобы снять жильё под куполом на Отисе. Нормальную работу найти. Чтобы она наконец жила как человек, а не как космическая крыса, вроде нас с тобой.</div><div><br></div><div>Кай долго молчал, доедая свою порцию. Потом негромко сказал, глядя на старика с уважением:</div><div><br></div><div>— Ты хорошо справился, Майкл. Лучше, чем многие на твоём месте.</div><div><br></div><div>Майкл посмотрел на него долгим, тяжёлым взглядом.</div><div><br></div><div>— Правда, парень?</div><div><br></div><div>— Более чем.</div><div><br></div><div>За брезентовой шторкой верхней койки Роузи лежала неподвижно, но с открытыми ярко-зелёными глазами. Она проснулась ещё несколько минут назад, когда услышала голоса. Сначала хотела вылезти и заявить о себе дерзкой шуткой, но потом... осталась слушать.</div><div><br></div><div>Тёплая, чуть грустная улыбка тронула её губы. Слова деда согревали грудь. Она осторожно подтянула колено, отчего шторка едва заметно шевелилась, и снова позволила себе помечтать о жизни после Отиса: тихий дом под надёжным куполом, отсутствие вечного гула двигателей, спокойствие... и почему-то рядом с этими мыслями всегда возникало лицо Кая Синта — капитана «Бордового Мула», человека из легенд её детства.</div><div><br></div><div>Снаружи корабля простиралась холодная, равнодушная бездна космоса. Впереди ждал ядовитый Отис со своими кислотными дождями и стальными куполами. А пока старый катер продолжал свой путь, неся в тесном брюхе трёх людей, каждый из которых очень хотел, чтобы после этого рейса их жизни наконец-то изменились к лучшему.</div><div><br></div><div><div>Тишина после разговора легла на кухонный уголок густо, как осадок от каши на дне тарелок. Кай медленно отставил свою пустую миску. Металл тихо звякнул о столешницу, и этот звук мгновенно утонул в низком, непрерывном гуле модернизированных двигателей под полом. Воздух в тесном жилом модуле всё ещё хранил запах овсянки, табака и разогретого металла.</div><div><br></div><div>Жёлтая лампа под потолком отбрасывала тёплый медный свет на потрёпанные стены, покрытые мелкими царапинами и старыми потёками. Складной столик на двоих стоял так близко к нише с кроватью, что достаточно было протянуть руку, чтобы коснуться брезентовой шторки. Вентиляционная решётка над головой едва слышно гудела, прогоняя тёплый воздух с лёгким привкусом машинного масла из технических отсеков.</div><div><br></div><div>Кай достал из кармана жилета очередную сигарету, размял её пальцами и прикурил. Дым лениво потянулся вверх. Он откинулся на стуле, насколько позволяла теснота, и посмотрел на старика.</div><div><br></div><div>— Знаешь, Майкл… — начал он негромко, почти лениво, но с искренней теплотой в голосе. — Я тут подумал, пока мы жрём эту овсянку в последний раз перед Отисом. После разгрузки хмеля… можете не искать себе новую дыру. Оставайтесь на «Муле». Оба.</div><div><br></div><div>Майкл поднял на него тяжёлый взгляд. Густые седые брови сошлись у переносицы, борода дрогнула.</div><div><br></div><div>— Оставайтесь, говоришь? — проворчал он низким, прокуренным голосом с тёплым ирландским рычанием, которое всегда проступало в минуты серьёзного разговора. — Ты серьёзно, парень?</div><div><br></div><div>— Абсолютно. — Кай пожал плечами, выдыхая дым в сторону. — Корабль старый, но крепкий. Работы всегда навалом. Ты знаешь каждый болт в этих двигателях лучше меня. А Роузи… место стрелка всегда найдётся. Или научится чему-то ещё. Молодая, шустрая. Не будет болтаться в доках, как мы когда-то.</div><div><br></div><div>Он усмехнулся уголком рта, но взгляд остался серьёзным.</div><div><br></div><div>Майкл долго молчал. Большие мозолистые руки медленно переплелись на столе, суставы тихо хрустнули. Он провёл ладонью по изрезанной столешнице, словно вспоминая каждую царапину, оставленную инструментами Карла. Взгляд старика потяжелел, ушёл в сторону фотографии на стене. Плечи слегка опустились — всего на секунду, но Кай это заметил.</div><div><br></div><div>— Хорошее предложение, Кай, — наконец проговорил Майкл. Голос звучал спокойно, но в нём чувствовалась усталость целой жизни. — Честное. И от сердца. Но… нет.</div><div><br></div><div>Он покачал головой, борода качнулась.</div><div><br></div><div>— Я слишком долго жил этим железом, парень. Доки, реакторы, бесконечные стыковки… Если я сдохну на корабле — никто и бровью не поведёт. А я не хочу. Не для неё.</div><div><br></div><div>Майкл кивнул в сторону брезентовой шторки.</div><div><br></div><div>— Хочу, чтобы у Роузи был настоящий дом. Не каюта. Не модуль с вечно гудящими трубами. Чтобы она могла открыть окно и услышать не диагностику двигателя, а хотя бы ветер или птиц. Чтобы соседи были за стенкой, а не за вакуумом. Я ей это слишком давно обещал.</div><div><br></div><div>Кай медленно кивнул, не споря. Он видел, как тяжело даются старику эти слова.</div><div><br></div><div>Майкл выпрямился. Взгляд стал жёстче, но в глубине глаз мелькнула какая-то старая боль.</div><div><br></div><div>— Но есть ещё кое-что, парень. Важное. Когда закончим с разгрузкой на Отисе… найди меня. Без спешки. Поговорить надо. Давно уже надо было.</div><div><br></div><div>— О чём? — тихо спросил Кай.</div><div><br></div><div>Майкл едва заметно качнул головой.</div><div><br></div><div>— Не здесь. И не сейчас. Это разговор не для кухни и точно не перед Роузи.</div><div><br></div><div>Последние слова он почти прошептал. Кай долго смотрел на старого друга, чувствуя вес этих слов, но ничего не спросил. Просто кивнул.</div><div><br></div><div>— Хорошо. Найду.</div><div><br></div><div>В этот момент за шторкой послышался мягкий шорох и тихий скрип пружин верхней койки. Кай бросил быстрый взгляд в сторону ниши.</div><div><br></div><div>Роузи сладко потянулась всем телом. Матрас снова тихо заскрипел. Она нарочно громко зевнула, давая понять, что «проснулась».</div><div><br></div><div>— М-м-м… ну и сон был…</div><div><br></div><div>Из-за шторки сначала показалась растрёпанная копна огненно-рыжих кудрей, потом — заспанное лицо с веснушками и прищуренными ярко-зелёными глазами. Девушка несколько секунд сидела на краю верхней койки, свесив стройные голые ноги. Короткая майка слегка задралась, открывая полоску гладкой кожи на талии, а тонкие шорты едва прикрывали бёдра. Она сонно потёрла лицо ладонями, отчего кудри окончательно разлохматились, и легко спрыгнула вниз. Босые ступни мягко шлёпнули по холодному металлическому полу.</div><div><br></div><div>— Брр… дубак тут у вас, мужики, — проворчала она хрипловатым со сна голосом и потянулась ещё раз, выгнув спину. Ткань майки натянулась на груди.</div><div><br></div><div>— Потому что кое-кто любит дрыхнуть до самого Отиса, — буркнул Майкл с привычной ворчливой теплотой.</div><div><br></div><div>— До какого Отиса? Мы ещё в космосе, дед. — Роузи показала ему язык и принюхалась. — Каша осталась?</div><div><br></div><div>Кай кивнул на кастрюлю.</div><div><br></div><div>— Ещё тёплая.</div><div><br></div><div>— Сначала душ. И не смейте доедать всё без меня, жадины.</div><div><br></div><div>Она схватила с крючка старое полотенце, свежую футболку и маленькую сумочку с принадлежностями, после чего босиком прошлёпала к кабинке в кормовом углу жилого модуля. Тонкая металлическая дверца за ней закрылась с лёгким скрипом. Через несколько секунд за переборкой зашумела вода — сначала рывками, потом ровной горячей струёй. Пар начал слегка просачиваться в щели.</div><div><br></div><div>Кай поднялся, раздавил окурок в импровизированной пепельнице.</div><div><br></div><div>— Пойду в рубку. Курс проверить.</div><div><br></div><div>Майкл молча кивнул. Капитан ушёл через узкий проход.</div><div><br></div><div>Старик тяжело вздохнул, собрал тарелки и отнёс их к маленькой мойке. Привычные, размеренные движения. Пока он ополаскивал посуду, за тонкой стенкой душевой кабины продолжала шуметь вода. Роузи что-то тихо мурлыкала себе под нос — едва слышно сквозь гул двигателей.</div><div><br></div><div>Майкл вытер руки о тряпку, огляделся и направился к узкому дверному проёму в переборке, ведущему в технический отсек. Задвижка привычно скрипнула, порог предательски выступал — старик перешагнул его автоматически, не глядя.</div><div><br></div><div>Сразу за порогом мир изменился. Тёплый запах еды и ткани остался позади. Здесь пахло горячим железом, смазкой, озоном и въевшейся за годы сваркой. Свет был ярче и жёстче — голая рабочая лампа без абажура отбрасывала резкие тени от труб, ящиков и верстака. Гул двигателей здесь ощущался сильнее, почти физически.</div><div><br></div><div>Майкл прошёл к своему рабочему месту, остановился у дальней переборки. Несколько секунд просто стоял, глядя на инструменты. Потом взял отвёртку и присел у низкой вентиляционной решётки, почти у самого пола. Два быстрых поворота — решётка вышла из пазов. Из узкой ниши между трубами он осторожно вытянул небольшую старинную деревянную шкатулку.</div><div><br></div><div>Старик держал её обеими большими ладонями, словно боялся уронить. Пальцы медленно провели по потёртой крышке, по знакомым царапинам и тёмному сучку в дереве. Лицо его изменилось — стало старше, тяжелее. Глаза потускнели. Он долго смотрел на шкатулку, не открывая. Одна тяжёлая слеза скатилась по морщинистой щеке и исчезла в седой бороде — он даже не вытер её.</div><div><br></div><div>Майкл прижал шкатулку к груди всего на секунду, закрыл глаза. Губы едва шевельнулись в беззвучном шёпоте. Потом глубоко вдохнул, словно прогоняя нахлынувшие воспоминания, аккуратно спрятал шкатулку обратно в нишу, прижал решётку и завернул винты.</div><div><br></div><div>Только после этого он позволил себе остаться неподвижным ещё несколько мгновений, слушая гул двигателей и далёкий шум воды в душе.</div></div><div><br></div><div class=\"book-img-inline float-left\" contenteditable=\"false\" style=\"width:40%\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAOiBkADASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAAAQACAwQFBgcICf/EAFQQAAIBAwMCBAQDBQUGAwUAEwECAwAEEQUSIQYxE0FRYQcUInEygZEVI0JSoTNicrHBCBYkQ4LRU2OSFyU0ouE1RFRzk7LwNsImJ2SD0vFFdKOz/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EACwRAQEAAgICAgICAgMBAAIDAAABAhEDIRIxBEETUSIyFGEFQnEjBjNSgcH/2gAMAwEAAhEDEQA/APjy55upAMD6iBUX8WDUk/8A8Q5/vGmH1rbJ8TiOVX2q+DnawyDTX5JOAM+QpuaJz51UClRGfyp2B6UQAMGljnNGjxigFSQCJmPjOyjBxtGcmmxkK4YqGAPIPnRkKtIzKoQE5CjyqBp70008qdu7Bx2zTQPUVqBYNAjBp9DFVUpW3+WBDOJgeRjgioDT6sXNjdW9rb3U0DJDcgmJyeGAOD/WgqoNzAE4BOCfSpbqJI53jjlWVFPDqMBqjII8sU4KxUsFJA7n0oGgDzpEc8UR3p3FA0YoEDNOYYoUDSvpRwKJpUSm+1AjFONDjzoBTolDyKjOEBIBY9h702jS3QToA7KrBgDgMPMetCieKRHHFSBuDS2miO9GlDSCKS06lj2pKEcGkBilSqIvXOk3lolo90scMd5D48Ds4wycjy7HI7GqXarVnqE9rbXNvGsTJcxiNy6BmUA5+knt+VVfvRQA5zRYZpDvRrUAAo+dGl50QCMUSKR780ftQJgmBtBBxzmgVxxTsetT39lPZSRpMEzJGsi7XDDaRx2oKxoU6ligbij5UQKuaXDYS3yJqdzLbWpB3SxR72BwccZHnigpAUcVJB4aTxtPG7xBgWUHaWXPkfLilMY2mkaFCkZYlFJyQPIZoujBj0o4
